services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-fraud}
      POSTGRES_PASSWORD: ${DB_PASS:-change-me}
      POSTGRES_DB: frauddb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fraud} -d frauddb"]
      interval: 5s
      retries: 10

  ml-service:
    build: ./ml-service
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      DB_USER: ${DB_USER:-fraud}
      DB_PASS: ${DB_PASS:-change-me}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: frauddb
      ML_SERVICE_URL: http://ml-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:5000
    depends_on:
      - backend

volumes:
  pgdata:
